name: Validate SonicStriker upgrade preview

on:
  push:
    branches:
      - sonicstriker-upgrade-preview
    paths:
      - script.js
      - .github/workflows/validate-upgrade-preview.yml
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check script.js
