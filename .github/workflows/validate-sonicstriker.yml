name: SonicStriker JavaScript validation

on:
  push:
    branches: [main]
    paths:
      - script.js
      - .github/workflows/validate-sonicstriker.yml
  pull_request:
    branches: [main]
    paths:
      - script.js
      - .github/workflows/validate-sonicstriker.yml
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check script.js
